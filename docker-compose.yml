services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subflow
      POSTGRES_PASSWORD: subflow
      POSTGRES_DB: subflow
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - subflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: run the built API image locally. `docker compose --profile full up`.
  # Day-to-day dev runs the API on the host (`cd apps/api && bun run dev`) against `db`.
  # One-shot: applies drizzle migrations before the api starts.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    working_dir: /repo/apps/api
    command: ["bun", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://subflow:subflow@db:5432/subflow
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # development: local run — LogMailer and the dev JWT secret are rejected
      # under NODE_ENV=production (env.ts / mailer.ts).
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://subflow:subflow@db:5432/subflow
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["full"]

volumes:
  subflow_pgdata:
